<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historial - DivisaPE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="hero hero-compacto">
    <nav class="container topnav">
      <a class="brand" href="/" aria-label="DivisaPE">
        <span class="brand-mark"><i class="bi bi-currency-exchange"></i></span>
        <span class="brand-name">Divisa<span>PE</span></span>
      </a>
      <div id="menu-principal" class="nav-acciones menu"></div>
    </nav>
    <div class="container hero-body">
      <p class="eyebrow">HISTORIAL</p>
      <h1>Tus conversiones guardadas</h1>
    </div>
  </header>

  <main class="container main-wrap">
    <section class="card panel" aria-labelledby="t-hist">
      <div class="card-body">
        <div class="panel-head">
          <div class="panel-title">
            <span class="step-icon"><i class="bi bi-clock-history"></i></span>
            <div>
              <h2 id="t-hist">Mi historial</h2>
              <p class="hint">Las conversiones que has guardado, de la más reciente a la más antigua.</p>
            </div>
          </div>
          <button type="button" id="hist-recargar" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-clockwise"></i> Actualizar</button>
        </div>
        <div id="hist-estado" class="estado" aria-live="polite"></div>
        <div id="hist-error" class="msg error" role="alert" hidden></div>
        <div class="table-responsive" id="hist-tabla" hidden>
          <table class="table align-middle mb-0">
            <thead><tr><th>Fecha</th><th>Monto</th><th>Tipo de cambio</th><th>Resultado</th></tr></thead>
            <tbody id="hist-filas"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">DivisaPE · Datos del BCRP, montos solo referenciales.</footer>
  <div id="toast" class="app-toast" role="status" aria-live="polite" hidden></div>

  <script src="/config.js"></script>
  <script src="/comun.js"></script>
  <script src="/historial.js"></script>
</body>
</html>
