<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta - DivisaPE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-page">
  <nav class="container topnav">
    <a class="brand" href="/" aria-label="DivisaPE">
      <span class="brand-mark"><i class="bi bi-currency-exchange"></i></span>
      <span class="brand-name">Divisa<span>PE</span></span>
    </a>
    <div id="menu-principal" class="nav-acciones menu"></div>
  </nav>

  <main class="auth-wrap">
    <section class="card panel auth-card" aria-labelledby="t-reg">
      <div class="card-body">
        <span class="step-icon mb-3"><i class="bi bi-person-plus"></i></span>
        <h1 id="t-reg" class="auth-titulo">Crea tu cuenta</h1>
        <p class="hint mb-4">Regístrate para guardar tus conversiones y consultarlas cuando quieras.</p>

        <form id="form-reg" class="vstack gap-3" novalidate>
          <div class="form-floating">
            <input type="text" class="form-control" id="reg-nombre" maxlength="120" autocomplete="off" placeholder="Nombre" autofocus>
            <label for="reg-nombre">Nombre</label>
          </div>
          <div class="form-floating">
            <input type="email" class="form-control" id="reg-email" maxlength="160" autocomplete="off" placeholder="Correo">
            <label for="reg-email">Correo electrónico</label>
          </div>
          <div>
            <div class="form-floating">
              <input type="password" class="form-control" id="reg-password" maxlength="72" autocomplete="new-password" placeholder="Contraseña">
              <label for="reg-password">Contraseña</label>
            </div>
            <div class="form-text">Mínimo 6 caracteres.</div>
          </div>
          <div class="form-floating">
            <input type="password" class="form-control" id="reg-password2" maxlength="72" autocomplete="new-password" placeholder="Repite la contraseña">
            <label for="reg-password2">Repite la contraseña</label>
          </div>
          <div>
            <div class="form-floating">
              <input type="text" class="form-control" id="reg-ruc" inputmode="numeric" maxlength="11" autocomplete="off" placeholder="RUC (opcional)">
              <label for="reg-ruc">RUC (opcional)</label>
            </div>
            <div class="form-text">Si tienes RUC, ponlo con sus 11 dígitos. Solo revisamos que el formato sea correcto.</div>
          </div>
          <div id="reg-error" class="msg error mt-0" role="alert" hidden></div>
          <button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-person-plus"></i> Crear cuenta</button>
        </form>

        <p class="auth-cambio">¿Ya tienes cuenta? <a href="/iniciar-sesion">Inicia sesión</a></p>
      </div>
    </section>
  </main>

  <footer class="site-footer site-footer-dark">DivisaPE · Datos del BCRP, montos solo referenciales.</footer>
  <div id="toast" class="app-toast" role="status" aria-live="polite" hidden></div>

  <script src="/config.js"></script>
  <script src="/comun.js"></script>
  <script src="/registro.js"></script>
</body>
</html>
